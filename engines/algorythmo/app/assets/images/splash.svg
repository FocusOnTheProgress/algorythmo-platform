<?xml version="1.0" encoding="UTF-8"?>
<!--
  Algorythmo OS — PWA splash / start screen
  -----------------------------------------------------------------------------
  Centered lockup on the brand dark surface. The viewBox is set to a 9:19.5
  ratio (modern phone aspect) but the artwork is centered, so it crops
  gracefully on any device. Used by the PWA start_url and as splash fallback.

  Background: alg-bg-base (oklch 0.145 ≈ #0e1318) for true OLED-friendly black.
  Mark and wordmark in brand teal at 12% scale.

  Status: PLACEHOLDER — final splash artwork TBD.

  Author: Algorythmo design system / 2026-05-23
  License: proprietary, internal use only
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 2532" preserveAspectRatio="xMidYMid slice">
  <!-- Background -->
  <rect width="1170" height="2532" fill="#0e1318"/>
  <!-- Centered lockup, sized to ~22% of width -->
  <g transform="translate(465 1166) scale(8.75)">
    <!-- Mark -->
    <g>
      <circle cx="16" cy="16" r="13" fill="none" stroke="#5ad6cf" stroke-width="2"/>
      <path d="M 24.66 8.5 L 28.5 5 L 23.5 5.5 Z" fill="#0e1318"/>
      <circle cx="16" cy="16" r="3" fill="#5ad6cf"/>
    </g>
    <!-- Wordmark below mark -->
    <text
      x="16" y="58"
      text-anchor="middle"
      font-family="InterDisplay, Inter, -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="11"
      font-weight="500"
      letter-spacing="-0.015em"
      fill="#9aa3ad">algorythmo</text>
  </g>
</svg>
