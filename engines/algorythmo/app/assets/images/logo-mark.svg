<?xml version="1.0" encoding="UTF-8"?>
<!--
  Algorythmo OS — brand mark (mark-only, square)
  -----------------------------------------------------------------------------
  Geometry: a precise circular gauge ("algo" = rhythm) interrupted by a single
  notch at the 1-o'clock position (the "signal"). Designed to read at 16x16.
  No gradients. No AI-cliché purple/blue. Single tone, defaults to brand teal,
  inherits currentColor when used inline.

  Status: PLACEHOLDER MARK — competent geometry, but the final mark is to be
  produced by a human brand designer. See DESIGN.md "Open questions".

  Author: Algorythmo design system / 2026-05-23
  License: proprietary, internal use only
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Algorythmo">
  <title>Algorythmo</title>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- Notch cutout: small wedge at 1 o'clock to break circular symmetry -->
  <path d="M 24.66 8.5 L 28.5 5 L 23.5 5.5 Z" fill="var(--alg-bg, #1d2025)"/>
  <!-- Inner dot — the operative center, the "OS" -->
  <circle cx="16" cy="16" r="3" fill="currentColor"/>
</svg>
