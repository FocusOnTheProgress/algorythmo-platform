<?xml version="1.0" encoding="UTF-8"?>
<!--
  Algorythmo OS — full lockup (mark + wordmark)
  -----------------------------------------------------------------------------
  Composition: mark on the left, wordmark "algorythmo" set in a geometric
  sans (placeholder: a curated Inter cut with adjusted tracking). The
  wordmark sits on the optical baseline of the mark. Generous letterspacing,
  lowercase only (lowercase reads more editorial; uppercase looks corporate).

  Status: PLACEHOLDER WORDMARK — final wordmark to be set in a custom
  display face by a human brand designer. See DESIGN.md "Open questions".

  Author: Algorythmo design system / 2026-05-23
  License: proprietary, internal use only
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" role="img" aria-label="Algorythmo">
  <title>Algorythmo</title>
  <!-- Mark — replicated from logo-mark.svg, scaled to 32x32 -->
  <g transform="translate(8 8)">
    <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M 24.66 8.5 L 28.5 5 L 23.5 5.5 Z" fill="var(--alg-bg, #1d2025)"/>
    <circle cx="16" cy="16" r="3" fill="currentColor"/>
  </g>
  <!-- Wordmark -->
  <text
    x="56" y="32"
    font-family="InterDisplay, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="-0.02em"
    fill="currentColor">algorythmo</text>
</svg>
