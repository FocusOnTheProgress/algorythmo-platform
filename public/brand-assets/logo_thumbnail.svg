<!-- algorythmo: Algorythmo OS app mark / favicon thumbnail — Cinematic OS C1 -->
<!-- Command-room black tile, hairline top highlight, white "A" monogram, single -->
<!-- cyan-teal brand dot (DESIGN.md §3.1). Placeholder pending brand curation (§15). -->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Algorythmo OS">
  <defs>
    <linearGradient id="alg-tile" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1E22"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#alg-tile)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none"
        stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <text x="256" y="346"
        font-family="Inter, InterDisplay, -apple-system, system-ui, sans-serif"
        font-size="300" font-weight="500" letter-spacing="-8"
        fill="#FFFFFF" text-anchor="middle">A</text>
  <circle cx="372" cy="150" r="22" fill="#16C8C2"/>
</svg>
