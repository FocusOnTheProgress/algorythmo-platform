            app/javascript/dashboard/modules/algorythmo/admin/financeiro/specs/FinanceiroDashboard.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/financeiro/specs/finance-overview-contract.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/rh/specs/RhDashboard.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/rh/specs/hr-overview-contract.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/facilities/specs/FacilitiesDashboard.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/facilities/specs/FacilitiesControlePane.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/facilities/specs/facilities-overview-contract.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/c-levels/specs/CLevelsBoardroom.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/inicio/specs/InicioScreen.spec.js \
            app/javascript/dashboard/routes/specs/stream-d-bare-entry.spec.js \
            app/javascript/dashboard/components-next/sidebar/specs/ChannelLeaf.spec.js \
            app/javascript/dashboard/components-next/sidebar/specs/SidebarChevron.spec.js \
            app/javascript/dashboard/components-next/sidebar/specs/SidebarCollapseNoLeak.spec.js \
            app/javascript/dashboard/components-next/sidebar/specs/SidebarGroupLeaf.spec.js \
            app/javascript/dashboard/components-next/sidebar/specs/SidebarManagementOrder.spec.js \
            app/javascript/dashboard/components-next/sidebar/specs/SidebarActiveNavRadius.spec.js \
            app/javascript/dashboard/components-next/sidebar/specs/SidebarStreamAConversas.spec.js \
            app/javascript/dashboard/components-next/sidebar/specs/SidebarContactsItemRender.spec.js \
            app/javascript/dashboard/modules/algorythmo/brain/specs/BrainAquario.spec.js \
            app/javascript/dashboard/modules/algorythmo/brain/specs/BrainViewer.spec.js \
            app/javascript/dashboard/modules/algorythmo/brain/specs/BrainHeader.spec.js \
            app/javascript/dashboard/modules/algorythmo/brain/specs/BrainTabVer.spec.js \
            app/javascript/dashboard/modules/algorythmo/brain/specs/BrainTabAjustar.spec.js \
            app/javascript/dashboard/modules/algorythmo/brain/specs/BrainTabHistorico.spec.js \
            app/javascript/dashboard/modules/algorythmo/brain/specs/BrainDocumentUpload.spec.js \
            app/javascript/dashboard/modules/algorythmo/brain/specs/brain.service.spec.js \
            app/javascript/dashboard/components/widgets/conversation/specs/OnboardingViewPurge.spec.js \
            app/javascript/dashboard/store/modules/specs/account/actions.spec.js \
            app/javascript/dashboard/api/specs/account.spec.js \
            --no-coverage

  # algorythmo: rspec scoped to Algorythmo engine + Captain feature-gate.
  # NO matrix sharding — this set is small (~12 spec files). Single runner.
  algorythmo-rspec:
    name: RSpec (Algorythmo scope)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm i

      - name: Create database
        run: bundle exec rake db:create

      - name: Load schema
        run: bundle exec rake db:schema:load

      # algorythmo: engine migrations are appended to the host migration path
      # at boot (engines/algorythmo/lib/algorythmo/engine.rb) but are NOT in
      # db/schema.rb, so db:migrate must run after schema:load to create
      # algorythmo_pipelines / algorythmo_stages / algorythmo_leads tables.
      - name: Run engine migrations
        run: bundle exec rake db:migrate

      - name: Run Algorythmo-scoped RSpec
        run: |
          bundle exec rspec \
            engines/algorythmo/spec \
            spec/models/concerns/algorythmo/feature_flag_bits_spec.rb \
            spec/models/account_spec.rb \
            spec/controllers/api/v1/accounts_controller_spec.rb \
            enterprise/spec/listeners/captain_listener_spec.rb \
            enterprise/spec/controllers/api/v1/accounts/captain/feature_gate_spec.rb \
            --profile=10 \
            --format progress \
            --format json --out tmp/rspec_results.json
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Upload rspec results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: algorythmo-rspec-results
          path: tmp/rspec_results.json

      - name: Upload rails log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: algorythmo-rails-log
          path: log

  # algorythmo: playwright-gate
  # Playwright smoke suite is a MERGE GATE — PRs cannot merge if these fail.
  # Runs against a fully booted Rails stack (PG + Redis + Rails server).
  # Decision T1 + T2 in docs/plans/0001-mvp-algorythmo-os.md.
  playwright-smoke:
    name: Playwright E2E smoke (algorythmo gate)
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, algorythmo-vitest, algorythmo-rspec]
    # Skip on dependabot PRs (no secrets available)
    if: ${{ github.actor != 'dependabot[bot]' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: chatwoot
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install pnpm dependencies
        run: pnpm i

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Set up .env for CI
        run: |
          cp .env.example .env
          echo "SECRET_KEY_BASE=ci_$(openssl rand -hex 32)" >> .env
          echo "POSTGRES_HOST=localhost" >> .env
          echo "POSTGRES_USERNAME=postgres" >> .env
          echo "POSTGRES_PASSWORD=" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env
          echo "REDIS_PASSWORD=" >> .env
          echo "FRONTEND_URL=http://localhost:3000" >> .env

      # algorythmo: pin RAILS_ENV=test so seed lands in chatwoot_test, the same
      # DB the rails server (started below with `-e test`) reads from. Without
      # this, db:create defaults to development and the server can't find the
      # seeded user — POST /auth/sign_in returns 401 against an empty test DB.
      - name: Set up database and seed test account
        run: |
          bundle exec rake db:create db:schema:load db:migrate
          bundle exec rake algorythmo:seed:smoke_test_account
        env:
          RAILS_ENV: test
          ALGORYTHMO_SEED_PASSWORD: ${{ secrets.ALGORYTHMO_SEED_PASSWORD }}

      # algorythmo: post-seed sanity check — verify bcrypt round-trip works
      # in the same env the server will run. Catches Devise pepper drift,
      # SECRET_KEY_BASE divergence, encoding mismatch, etc. with a clear error.
      - name: Verify seed user can authenticate (bcrypt round-trip)
        run: |
          bundle exec rails runner '
            email = "test@algorythmo.com"
            user  = User.find_by(email: email)
            raise "[verify] user not found in #{Rails.env} DB" if user.nil?
            ok = user.valid_password?(ENV.fetch("ALGORYTHMO_SEED_PASSWORD"))
            raise "[verify] valid_password? returned FALSE — seed/login pwd diverge" unless ok
            puts "[verify] OK — user #{email} can authenticate in #{Rails.env}"

            super_email = "super@algorythmo.com"
            super_pass  = "Test@12345"
            super_user  = SuperAdmin.find_by(email: super_email)
            raise "[verify] super-admin not found via STI in #{Rails.env} DB" if super_user.nil?
            super_ok = super_user.valid_password?(super_pass)
            raise "[verify] super-admin valid_password? returned FALSE" unless super_ok
            puts "[verify] OK — super-admin #{super_email} can authenticate in #{Rails.env}"
          '
        env:
          RAILS_ENV: test
          ALGORYTHMO_SEED_PASSWORD: ${{ secrets.ALGORYTHMO_SEED_PASSWORD }}

      # algorythmo: precompile assets so the SPA can boot under puma in test env.
      # vite-plugin-ruby honors config/vite.json -> writes to public/vite-test/.
      # Without this, /app/login serves a layout pointing at a non-existent
      # manifest and Playwright sees ERR_ABORTED on page.goto.
      - name: Precompile frontend assets (vite build)
        run: bundle exec rake assets:precompile
        env:
          RAILS_ENV: test
          NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=4096
          SECRET_KEY_BASE: ci_placeholder_for_precompile_only

      - name: Start Rails server (background)
        run: |
          bundle exec rails server -p 3000 -e test > /tmp/rails.log 2>&1 &
          echo "Waiting for server..."
          until curl -sf http://localhost:3000/auth/sign_in; do sleep 2; done
        timeout-minutes: 3

      # algorythmo: snapshot da página /app/login antes do Playwright p/ diagnóstico.
      - name: Snapshot /app/login HTML for debug
        run: |
          curl -sL http://localhost:3000/app/login -o /tmp/app-login.html || true
          echo "=== /app/login first 200 lines ==="
          head -200 /tmp/app-login.html || true

      - name: Run Playwright smoke suite
        run: pnpm exec playwright test e2e/smoke.spec.ts --trace=on
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_EMAIL: test@algorythmo.com
          PLAYWRIGHT_PASSWORD: ${{ secrets.ALGORYTHMO_SEED_PASSWORD }}

      # algorythmo: feature-gate — M2-B1 cuts suite gate (PR 7).
      # Runs the 13 cut-flag e2e specs against the same server. Uses the
      # super-admin user seeded above to toggle flags. Defaults match the
      # _fixture.ts defaults (super@algorythmo.com / Test@12345) so no extra
      # secrets are needed for the super-admin session; the password is a
      # test-only credential that never reaches a real environment.
      - name: Run Playwright algorythmo-cuts suite
        run: pnpm exec playwright test --project algorythmo-cuts --trace=on
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_EMAIL: test@algorythmo.com
          PLAYWRIGHT_PASSWORD: ${{ secrets.ALGORYTHMO_SEED_PASSWORD }}
          PLAYWRIGHT_SUPER_ADMIN_EMAIL: super@algorythmo.com
          PLAYWRIGHT_SUPER_ADMIN_PASS: Test@12345
          PLAYWRIGHT_ACCOUNT_ID: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Rails log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-rails-log
          path: |
            /tmp/rails.log
            /tmp/app-login.html
            log/test.log

  # algorythmo: soft-fork-ci-check
  # Validates that every file in the soft-fork zone exists and is tagged.
  # This is a MERGE GATE — PRs cannot merge if soft-fork zone integrity fails.
  # See engines/algorythmo/README.md § Soft-fork zone for the acceptance table.
  soft-fork-check:
    name: Soft-fork zone integrity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate soft-fork zone tags # algorythmo: soft-fork-ci-check
        run: bash engines/algorythmo/bin/check-soft-fork-zone.sh
