name: Run Algorythmo OS spec
permissions:
  contents: read
on:
  push:
    branches:
      - algorythmo/main
      - 'algorythmo/**'
  pull_request:
  workflow_dispatch:

# Cancel older runs in the same PR — saves minutes on rapid pushes.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# algorythmo: free-tier-budget
# This workflow is deliberately scoped to ONLY Algorythmo-owned code so the
# whole fork stays inside the GitHub Actions free tier (2 000 min/month).
# Upstream Chatwoot suites (full RSpec, MFA, size-limit, docker build,
# duplicate frontend job) live in .github/workflows/disabled/ and are
# reactivated only when we move off the free tier.
#
# Coverage map:
#   - lint-backend         → Rubocop em paralelo (1 runner, ~3 min)
#   - lint-frontend        → ESLint full repo (1 runner, ~3 min)
#   - algorythmo-rspec     → engine specs + Captain feature-gate specs (1 runner)
#   - algorythmo-vitest    → engine JS specs + i18n overlays + gate composable
#   - playwright-smoke     → MERGE GATE (ADR T1/T2) sobe stack real + smoke
#   - soft-fork-check      → MERGE GATE (zona soft-fork íntegra)

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run Rubocop
        run: bundle exec rubocop --parallel

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install pnpm dependencies
        run: pnpm i
      - name: Run ESLint
        run: pnpm run eslint

  # algorythmo: vitest scoped to Algorythmo-owned specs only.
  # Explicit --include globs override vite.config.ts's broader include.
  algorythmo-vitest:
    name: Vitest (Algorythmo scope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install pnpm dependencies
        run: pnpm i
      - name: Run Algorythmo-scoped Vitest
        run: |
          TZ=UTC pnpm exec vitest run \
            engines/algorythmo/app/javascript \
            engines/algorythmo/app/assets/stylesheets/specs \
            app/javascript/dashboard/composables/specs/useAlgorythmoFeatureGate.spec.js \
            app/javascript/dashboard/composables/algorythmo/specs/useAlgMotion.spec.js \
            app/javascript/dashboard/composables/algorythmo/specs/useAlgChartTheme.spec.js \
            app/javascript/dashboard/helper/specs/routeHelpers_algorythmo.spec.js \
            app/javascript/dashboard/helper/specs/themeHelper.spec.js \
            app/javascript/dashboard/i18n/i18n_overlay.spec.js \
            app/javascript/survey/i18n/i18n_overlay.spec.js \
            app/javascript/widget/i18n/i18n_overlay.spec.js \
            app/javascript/dashboard/components-next/copilot/specs/CopilotLauncher.spec.js \
            app/javascript/dashboard/components-next/algorythmo/specs \
            app/javascript/dashboard/routes/specs/algorythmoCutFlagCoverage.spec.js \
            app/javascript/dashboard/routes/specs/algorythmoFeatureFlagCoverage.spec.js \
            app/javascript/dashboard/routes/specs/m6-1-a-foundation.spec.js \
            app/javascript/dashboard/routes/specs/m6-1-b-sidebar-route.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/specs/demoData.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/specs/KanbanBoardDemoGate.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/specs/algorythmoCrmLocaleParity.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/specs/accentInk.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/components/specs/StageColumn.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/components/specs/LeadCard.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/components/specs/KanbanHeader.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/components/specs/MoveLeadModal.spec.js \
            app/javascript/dashboard/routes/dashboard/crm/views/components/specs/LeadDetailDrawer.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/sectors/specs/SectorShellV2.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/sectors/specs/SectorAgentChat.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/reports-commercial/specs/ReportsCommercialOverlay.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/reports-commercial/specs/CustomerSupportPane.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/reports-commercial/specs/commercial-overview-contract.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/marketing/specs/MarketingDashboard.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/marketing/specs/marketing-overview-contract.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/operacao/specs/OperacaoDashboard.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/operacao/specs/operations-overview-contract.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/compras/specs/ComprasDashboard.spec.js \
            app/javascript/dashboard/modules/algorythmo/admin/compras/specs/procurement-overview-contract.spec.js \
