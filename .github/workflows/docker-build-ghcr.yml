name: Build & push Docker image to ghcr.io

# algorythmo: external-build pipeline
#
# A VPS de 4 GB OOM-kill o build local (grpc/nokogiri/assets:precompile picam
# acima do limite mesmo com -j 1 + NODE_OPTIONS=2048). Para destravar deploys
# enquanto a VPS nao for upgradeada, buildamos a imagem em runner Linux do
# GitHub (7 GB RAM, 4 vCPU, 14 GB disk) e empurramos para ghcr.io. O Easypanel
# entao apenas faz `docker pull` da imagem pronta — zero compile na VPS.
#
# Trigger:
#   - workflow_dispatch (botao manual em Actions)
#   - push em algorythmo/main quando o Dockerfile, Gemfile.lock, pnpm-lock ou
#     codigo da aplicacao mudar. Filtros conservadores para nao gastar minutos
#     em commits que so tocam docs.
#
# Tags publicadas:
#   - latest       (ultimo build de algorythmo/main)
#   - sha-<hash>   (rastreabilidade)
#
# Custo: free tier do GitHub Actions = 2 000 min/mes em repo privado. Build
# completo ~ 30-50 min. Ate 30+ builds/mes cabe no orcamento gratuito.

on:
  workflow_dispatch:
  push:
    branches:
      - algorythmo/main
    paths:
      - 'docker/Dockerfile'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'app/**'
      - 'lib/**'
      - 'config/**'
      - 'engines/**'
      - 'enterprise/**'
      - 'public/**'
      - 'db/**'
      - 'bin/**'
      - '.github/workflows/docker-build-ghcr.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/algorythmo-platform
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/algorythmo/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUNDLE_JOBS=4
            NODE_OPTIONS=--max-old-space-size=4096 --openssl-legacy-provider
          cache-from: type=gha
          cache-to: type=gha,mode=max
