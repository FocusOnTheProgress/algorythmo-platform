name: Build Algorythmo OS Image

on:
  workflow_dispatch:
  push:
    branches:
      - chore/dockerfile-lowmem-build
      - algorythmo/main
    paths:
      - 'docker/Dockerfile'
      - '.github/workflows/build-and-push.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/focusontheprogress/algorythmo-platform:latest
            ghcr.io/focusontheprogress/algorythmo-platform:${{ github.sha }}
          build-args: |
            BUNDLE_JOBS=4
            NODE_OPTIONS=--max-old-space-size=4096 --openssl-legacy-provider
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
